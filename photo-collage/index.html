<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Grid Coordinate Calculator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; margin: 0; padding: 25px; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; }
        .input-panel { background: white; width: 350px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
        .output-panel { flex: 1; background: #0f172a; color: #38bdf8; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; box-sizing: border-box; }
        h3 { margin: 0 0 10px 0; font-size: 18px; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .out-title { color: #f8fafc; border-bottom: 2px solid #334155; }
        .input-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        label { font-size: 13px; font-weight: 600; color: #475569; }
        input, select { width: 110px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; text-align: right; box-sizing: border-box; }
        select { text-align: left; }
        button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
        .log-area { font-family: 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.6; overflow-y: auto; flex: 1; background: #020617; padding: 15px; border-radius: 6px; border: 1px solid #1e293b; color: #cbd5e1; margin-top: 10px; white-space: pre; }
        .coordinate-highlight { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="input-panel">
    <h3>Grid Settings</h3>
    
    <div class="input-row">
        <label>Page Format</label>
        <select id="pageSize">
            <option value="A4">A4 (2480 × 3508 px)</option>
            <option value="A5">A5 (1748 × 2480 px)</option>
        </select>
    </div>

    <div class="input-row">
        <label>Photo Width (px)</label>
        <input type="number" id="photoW" value="405">
    </div>

    <div class="input-row">
        <label>Photo Height (px)</label>
        <input type="number" id="photoH" value="518">
    </div>

    <div class="input-row">
        <label>Normal Gap (px)</label>
        <input type="number" id="normalGap" value="5">
    </div>

    <div class="input-row">
        <label>Separator Gap (px)</label>
        <input type="number" id="separatorGap" value="50">
    </div>

    <div class="input-row">
        <label>Start X Margin (px)</label>
        <input type="number" id="startX" value="5">
    </div>

    <div class="input-row">
        <label>Start Y Margin (px)</label>
        <input type="number" id="startY" value="40">
    </div>

    <div class="input-row">
        <label>Photos per Row</label>
        <input type="number" id="colsCount" value="6">
    </div>

    <div class="input-row">
        <label>Photos per Column</label>
        <input type="number" id="rowsCount" value="6">
    </div>

    <button onclick="calculateGrid()">Calculate Coordinates</button>
</div>

<div class="output-panel">
    <h3 class="out-title">Calculated Pixel Coordinates</h3>
    <div class="log-area" id="outputLog">Adjust your input variables and click "Calculate Coordinates" to view your exact canvas pixel matrix mapping.</div>
</div>

<script>
    function calculateGrid() {
        // Grab values from inputs
        const sizeKey = document.getElementById('pageSize').value;
        const pageW = sizeKey === 'A4' ? 2480 : 1748;
        const pageH = sizeKey === 'A4' ? 3508 : 2480;
        
        const photoW = parseInt(document.getElementById('photoW').value) || 0;
        const photoH = parseInt(document.getElementById('photoH').value) || 0;
        const normalGap = parseInt(document.getElementById('normalGap').value) || 0;
        const separatorGap = parseInt(document.getElementById('separatorGap').value) || 0;
        const startX = parseInt(document.getElementById('startX').value) || 0;
        const startY = parseInt(document.getElementById('startY').value) || 0;
        const cols = parseInt(document.getElementById('colsCount').value) || 0;
        const rows = parseInt(document.getElementById('rowsCount').value) || 0;

        let currentY = startY;
        let log = `=== CALCULATED MASTER MAP (${sizeKey} @ 300 DPI) ===\n`;
        log += `Canvas Size Boundary: ${pageW}px wide by ${pageH}px high\n`;
        log += `Individual Photo Footprint: ${photoW}px × ${photoH}px\n`;
        log += `---------------------------------------------------------\n\n`;

        // Loop to generate pure grid math values
        for (let r = 1; r <= rows; r++) {
            let currentX = startX;
            log += `[ROW ${r}] -----------------------------------------------\n`;
            
            for (let c = 1; c <= cols; c++) {
                log += `  Photo Position (Col ${c}, Row ${r}):   X = ${currentX.toString().padEnd(5)}  Y = ${currentY}\n`;
                
                // Advance X to calculate the next column's starting point
                currentX += photoW + normalGap;
            }
            
            // Check if the page dimensions are completely breached horizontally
            if ((currentX - normalGap) > pageW) {
                log += `  ⚠️ WARNING: Row ${r} exceeds your canvas width (${pageW}px) by ${(currentX - normalGap) - pageW}px!\n`;
            }
            log += `\n`;

            // Calculate the Y coordinate for the next row downward
            // Injects a heavy custom spacer after every 2 rows
            if (r % 2 === 0 && r !== rows) {
                currentY += photoH + separatorGap;
            } else {
                currentY += photoH + normalGap;
            }
        }

        // Print page constraint sanity checks
        const totalUsedHeight = currentY - normalGap;
        log += `---------------------------------------------------------\n`;
        log += `PAGE SUMMARY LOG:\n`;
        log += ` -> Maximum Right Edge Reached: ${startX + (cols * photoW) + ((cols - 1) * normalGap)}px / ${pageW}px\n`;
        log += ` -> Total Cumulative Grid Height: ${totalUsedHeight}px / ${pageH}px\n`;
        
        if (totalUsedHeight > pageH) {
            log += ` -> ❌ ERROR: Your grid heights run off the sheet by ${totalUsedHeight - pageH}px! Reduce your photo height or row counts.\n`;
        } else {
            log += ` -> Safe Space Remaining at Bottom: ${pageH - totalUsedHeight}px\n`;
        }

        document.getElementById('outputLog').textContent = log;
    }
</script>

</body>
</html>
